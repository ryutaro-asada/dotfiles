onboarding = false
[theme]
name = "gruvbox"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
# Let herdr-auto-title name new tabs (a name typed in the prompt counts as manual).
prompt_new_tab_name = false

# Nav with Preview plugin: prefix+W opens the navigator popup.
# (prefix+w is herdr's built-in workspace navigator, so we use shift+W.)
[[keys.command]]
key = "prefix+W"
type = "shell"
command = "herdr plugin pane open --plugin ryutaroasada.nav-with-preview --entrypoint nav"

# herdr-translate: prefix+t translates the selected text.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "ryutaroasada.translate.translate"
description = "translate selection"
